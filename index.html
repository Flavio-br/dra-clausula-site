<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:,">
  <title>Dra.Cláusula | Análise Inteligente de Contratos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: Arial, sans-serif; background:#f6f6f6; padding:30px; max-width:600px; margin:auto; }
    section, form { background:#fff; padding:20px; margin-bottom:20px; border-radius:8px; }
    button { width:100%; padding:12px; margin-top:10px; font-size:16px; cursor:pointer; }
    button:disabled { background:#ccc; cursor:not-allowed; }
    .msg { margin-top:10px; font-weight:bold; }
    #version { text-align:right; font-size:12px; color:#777; }
    label { display:block; margin-top:10px; font-weight:bold; }
    input, select { width:100%; padding:10px; margin-top:5px; }
  </style>
</head>

<body>
  <section>
    <button id="btnTermo">Confira nosso Termo de Confidencialidade</button>
    <button id="btnComoFunciona">Como funciona nosso serviço</button>
  </section>

  <section>
    <label for="email">E-mail</label>
    <input type="email" id="email" autocomplete="email" />

    <label for="confirmEmail">Confirmar E-mail</label>
    <input type="email" id="confirmEmail" autocomplete="email" />

    <label for="voucher">Voucher</label>
    <input type="text" id="voucher" placeholder="Ex: DRA001" />

    <button id="btnPagamento">Realizar Pagamento - R$ 19,90</button>
    <div id="status" class="msg"></div>
  </section>

  <form>
    <fieldset id="analiseFieldset" disabled>
      <label>Nome</label>
      <input type="text" id="nome" />

      <label>Papel no contrato</label>
      <select id="parte">
        <option value="">Selecione...</option>
        <option value="comprador">Comprador</option>
        <option value="vendedor">Vendedor</option>
        <option value="contratante">Contratante</option>
        <option value="contratado">Contratado</option>
      </select>

      <label>Arquivo</label>
      <input type="file" id="arquivo" />

      <button id="btnEnviar" type="button">Enviar para Análise</button>
    </fieldset>
  </form>

  <div id="version">v 1.110</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  // ===== CONFIG =====
  const API_BASE_URL = "https://contrato-analisador-api.onrender.com";
  const VALID_VOUCHER_CODE = "DRA001";
  const VOUCHER_PRICE = "0.01";
  const DEFAULT_PRICE = "19.90";

  // ===== ELEMENTS =====
  const btnTermo = document.getElementById("btnTermo");
  const btnComo = document.getElementById("btnComoFunciona");
  const btnPagamento = document.getElementById("btnPagamento");
  const voucherInput = document.getElementById("voucher");
  const emailInput = document.getElementById("email");
  const confirmEmailInput = document.getElementById("confirmEmail");
  const statusEl = document.getElementById("status");

  // mantém área inferior visível e desabilitada
  const fieldset = document.getElementById("analiseFieldset");
  fieldset.disabled = true;

  // user_id persistente
  const USER_ID_KEY = "draClausulaUserId";
  let userId = localStorage.getItem(USER_ID_KEY);
  if (!userId) {
    userId = "user_" + Date.now() + Math.random().toString(36).substring(2, 10);
    localStorage.setItem(USER_ID_KEY, userId);
  }

  // preço atual
  let itemPrice = DEFAULT_PRICE;

  // ===== HELPERS =====
  const validateEmail = (email) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email).toLowerCase());

  const setStatus = (msg, color = "#333") => {
    statusEl.textContent = msg;
    statusEl.style.color = color;
  };

  // ===== INFO BUTTONS (mantém funcionando) =====
  btnTermo.addEventListener("click", () => {
    alert("Termo de Confidencialidade: (mantido conforme seu layout completo).");
  });

  btnComo.addEventListener("click", () => {
    alert("Como funciona: (mantido conforme seu layout completo).");
  });

  // ===== VOUCHER =====
  voucherInput.addEventListener("input", () => {
    const v = voucherInput.value.trim().toUpperCase();

    if (v === VALID_VOUCHER_CODE) {
      itemPrice = VOUCHER_PRICE;
      btnPagamento.textContent = "Realizar Pagamento - R$ 0,01";
      setStatus("Voucher aplicado! Valor: R$ 0,01", "green");
    } else if (v === "") {
      itemPrice = DEFAULT_PRICE;
      btnPagamento.textContent = "Realizar Pagamento - R$ 19,90";
      setStatus("", "#333");
    } else {
      itemPrice = DEFAULT_PRICE;
      btnPagamento.textContent = "Realizar Pagamento - R$ 19,90";
      setStatus("Voucher inválido.", "red");
    }
  });

  // ===== PAGAMENTO REAL =====
  btnPagamento.addEventListener("click", async () => {
    const email = emailInput.value.trim();
    const confirmEmail = confirmEmailInput.value.trim();

    if (!validateEmail(email)) {
      setStatus("Informe um e-mail válido.", "red");
      return;
    }
    if (email !== confirmEmail) {
      setStatus("Os e-mails não coincidem.", "red");
      return;
    }

    btnPagamento.disabled = true;
    setStatus("Redirecionando para o pagamento...", "#b8860b");

    try {
      const formData = new FormData();
      formData.append("item_title", "Análise de Contrato Dra. Cláusula");
      formData.append("item_price", itemPrice);
      formData.append("user_email", email);
      formData.append("user_id", userId);

      const urlCheckout = `${API_BASE_URL}/api/pagamento/criar-checkout`;
    console.log("Chamando checkout em:", urlCheckout);

      const resp = await fetch(`${API_BASE_URL}/api/pagamento/criar-checkout`, {
        method: "POST",
        body: formData
      });
      
    console.log("Status HTTP:", resp.status);

      const data = await resp.json();

      if (!resp.ok) {
        setStatus(data.detail || "Erro ao criar link de pagamento.", "red");
        btnPagamento.disabled = false;
        return;
      }

      if (!data.checkout_url) {
        setStatus("API não retornou checkout_url.", "red");
        btnPagamento.disabled = false;
        return;
      }

      // redireciona ao Mercado Pago
      window.location.href = data.checkout_url;

    } catch (err) {
      console.error(err);
      setStatus("Erro de conexão ao iniciar pagamento.", "red");
      btnPagamento.disabled = false;
    }
  });

});
</script>

</body>
</html>
