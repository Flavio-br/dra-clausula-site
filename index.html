<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dra.Cláusula | Análise Inteligente de Contratos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f6f6f6;
            padding: 30px;
            max-width: 600px;
            margin: auto;
        }
        section, form {
            background: #fff;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        #version {
            text-align: right;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>

<body>

<section>
    <button id="btnTermo">Confira nosso Termo de Confidencialidade</button>
    <button id="btnComoFunciona">Como funciona nosso serviço</button>
</section>

<section>
    <label>E-mail</label>
    <input type="email" id="email"><br><br>

    <label>Confirmar E-mail</label>
    <input type="email" id="confirmEmail"><br><br>

    <label>Voucher</label>
    <input type="text" id="voucher">

    <button id="btnPagamento">Realizar Pagamento - R$ 19,90</button>
</section>

<form>
    <fieldset id="analiseFieldset" disabled>
        <label>Nome</label>
        <input type="text"><br><br>

        <label>Papel no contrato</label>
        <select>
            <option>Comprador</option>
            <option>Vendedor</option>
        </select><br><br>

        <label>Arquivo</label>
        <input type="file"><br><br>

        <button>Enviar para Análise</button>
    </fieldset>
</form>

<div id="version">v 1.109</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const btnTermo = document.getElementById("btnTermo");
    const btnComo = document.getElementById("btnComoFunciona");
    const btnPagamento = document.getElementById("btnPagamento");
    const voucher = document.getElementById("voucher");
    const fieldset = document.getElementById("analiseFieldset");

    let preco = "19.90";

    btnTermo.onclick = () => alert("Termo de Confidencialidade OK");
    btnComo.onclick = () => alert("Como funciona OK");

    voucher.addEventListener("input", () => {
        if (voucher.value.trim().toUpperCase() === "DRA001") {
            preco = "0.01";
            btnPagamento.textContent = "Realizar Pagamento - R$ 0,01";
        } else {
            preco = "19.90";
            btnPagamento.textContent = "Realizar Pagamento - R$ 19,90";
        }
    });

    btnPagamento.onclick = () => {
        alert("Pagamento disparado com valor R$ " + preco);
        fieldset.disabled = false;
    };

});
</script>

</body>
</html>
